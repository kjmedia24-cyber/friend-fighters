<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIEND FIGHTERS — 친구 대전 격투</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0a14'/><text x='2' y='12' font-size='10'>🥊</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="css/style.css?v=ffbe5a0">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1440" height="810"></canvas>
  <div id="hint">
    AI전: <b>방향키</b> 이동 · <b>A</b>왼손 <b>S</b>오른손 <b>Z</b>왼발 <b>X</b>오른발 · <b>SPACE</b> 가드 &nbsp;|&nbsp;
    2인전: P1 <b>WASD</b>+<b>R/T/F/G</b>+<b>E</b>가드 · P2 <b>방향키</b>+<b>U/I/J/K</b>+<b>O</b>가드<br>
    <b>→→/←←</b> 스텝 · <b>가드</b> 게이지 소모(다 닳면 그로기!) · 맞기 직전 가드 = <b>퍼펙트 가드</b>(상대 공격 봉인) ·
    <b>←·→+버튼</b> 추가 기술 · <b>↓→+펀치</b> 필살기 · <b>↓→+킥</b> 띄우기 · <b>↓+발</b> 하단 · <b>양펀치 동시</b> 잡기 · <b>M</b> 음소거
  </div>
</div>
<!-- 터치 가상패드 (모바일에서만 표시) -->
<div id="touch">
  <div class="tpad">
    <div class="tbtn" data-key="ArrowLeft">◀</div>
    <div class="tbtn" data-key="ArrowUp">▲</div>
    <div class="tbtn" data-key="ArrowDown">▼</div>
    <div class="tbtn" data-key="ArrowRight">▶</div>
  </div>
  <div class="tatk">
    <div class="tbtn atk" data-key="KeyA">A</div>
    <div class="tbtn atk" data-key="KeyS">S</div>
    <div class="tbtn atk" data-key="KeyZ">Z</div>
    <div class="tbtn atk" data-key="KeyX">X</div>
    <div class="tbtn atk grab" data-key="Space">가드</div>
    <div class="tbtn atk grab" data-key="KeyA KeyS">잡기</div>
    <div class="tbtn atk start" data-key="Enter">START</div>
  </div>
</div>
<script src="js/data.js?v=ffbe5a0"></script>
<script src="js/input.js?v=ffbe5a0"></script>
<script src="js/sprites.js?v=ffbe5a0"></script>
<script src="js/fx.js?v=ffbe5a0"></script>
<script src="js/stages.js?v=ffbe5a0"></script>
<script src="js/fighter.js?v=ffbe5a0"></script>
<script src="js/ai.js?v=ffbe5a0"></script>
<script src="js/game.js?v=ffbe5a0"></script>
<script src="js/main.js?v=ffbe5a0"></script>
</body>
</html>
