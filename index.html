<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIEND FIGHTERS — 친구 대전 격투</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1440" height="810"></canvas>
  <div id="hint">
    AI전: <b>방향키</b> 이동 · <b>A</b>왼손 <b>S</b>오른손 <b>Z</b>왼발 <b>X</b>오른발 &nbsp;|&nbsp;
    2인전: P1 <b>WASD</b>+<b>R/T/F/G</b> · P2 <b>방향키</b>+<b>U/I/J/K</b><br>
    <b>→→</b> 앞스텝 · <b>↓→+펀치</b> 필살기 · <b>↓→+킥</b> 띄우기 · <b>↓꾹→떼기</b> 기상어퍼 ·
    <b>↓+발</b> 하단 · <b>양펀치 동시</b> 잡기(잡힌 직후 펀치로 풀기) · <b>M</b> 음소거
  </div>
</div>
<!-- 터치 가상패드 (모바일에서만 표시) -->
<div id="touch">
  <div class="tpad">
    <div class="tbtn" data-key="ArrowLeft">◀</div>
    <div class="tbtn" data-key="ArrowUp">▲</div>
    <div class="tbtn" data-key="ArrowDown">▼</div>
    <div class="tbtn" data-key="ArrowRight">▶</div>
  </div>
  <div class="tatk">
    <div class="tbtn atk" data-key="KeyA">A</div>
    <div class="tbtn atk" data-key="KeyS">S</div>
    <div class="tbtn atk" data-key="KeyZ">Z</div>
    <div class="tbtn atk" data-key="KeyX">X</div>
    <div class="tbtn atk grab" data-key="KeyA KeyS">잡기</div>
    <div class="tbtn atk start" data-key="Enter">START</div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/fx.js"></script>
<script src="js/stages.js"></script>
<script src="js/fighter.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
